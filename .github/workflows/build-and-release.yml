name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # 'true' when this push/PR touches library source — gates the RC publish below
      # so docs-only / test-only changes don't cut a new NuGet prerelease.
      src: ${{ steps.filter.outputs.src }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          src:
            - 'src/**'

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important for versioning
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
    
    - name: Pack
      run: |
        # Determine version
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(date +%Y.%m.%d)-rc.$GITHUB_RUN_NUMBER
        fi
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Packing version $VERSION"

        # All packages share the same $VERSION. Because PackageVersion is a global MSBuild property,
        # each project's project-reference dependencies (Andy.Tools.Data -> Andy.Tools,
        # Andy.Tools.Pdf -> Andy.Tools) resolve to the same $VERSION, so they publish together as a
        # consistent set. Andy.Tools.Pdf keeps its own pinned PackageReference on Andy.Doc.Pdf — that
        # is a hard dependency version and is unaffected by PackageVersion. Giving the PDF package the
        # same unique-per-build version is what lets later PDF source changes actually get published
        # (a fixed version would be skipped by --skip-duplicate and silently left unpublished).
        for proj in \
          src/Andy.Tools/Andy.Tools.csproj \
          src/Andy.Tools.Data/Andy.Tools.Data.csproj \
          src/Andy.Tools.Pdf/Andy.Tools.Pdf.csproj \
          src/Andy.Tools.Mcp/Andy.Tools.Mcp.csproj; do
          dotnet pack "$proj" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion=$VERSION
        done

    - name: List packaged ids and versions
      run: |
        # Log every package id@version before publishing so a stale or duplicate version is
        # visible in the build log rather than failing silently at push time.
        echo "Packages staged for publish:"
        for pkg in ./artifacts/*.nupkg; do
          echo "  - $(basename "$pkg")"
        done
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 7

  publish-prerelease:
    needs: [build, changes]
    runs-on: ubuntu-latest
    # Only publish a dated RC when pushing to main AND library source changed.
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.src == 'true'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Publish to NuGet
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --source ${{ env.NUGET_SOURCE }} \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Publish to NuGet
      run: |
        # --skip-duplicate so a re-run, or a package whose version already exists (e.g. the PDF
        # package when only unrelated packages changed), does not fail the job before the GitHub
        # release is created. Genuinely new versions still publish.
        dotnet nuget push ./artifacts/*.nupkg \
          --source ${{ env.NUGET_SOURCE }} \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}